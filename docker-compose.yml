services:
  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    networks:
      - mern-network
    volumes:
      - mern-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: server
    restart: always
    ports:
      - "9000:9000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mern
    networks:
      - mern-network
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build: ./client
    container_name: client
    restart: always
    ports:
      - "3000:3000"
    networks:
      - mern-network
    depends_on:
      - server

networks:
  mern-network:
    driver: bridge

volumes:
  mern-data: